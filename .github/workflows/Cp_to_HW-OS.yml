# Force refresh — 2026-02-20
name: Create Hardware-OS Issue (with runtime debug)

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: cp-hwos-child-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create_hardware_os_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Dump runtime workflow info (temporary debug)
        if: always()
        env:
          CP_NUMBER: ${{ github.event.issue.number }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euxo pipefail

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "Runner: $(uname -a)"

          echo
          echo "----- Listing .github/workflows -----"
          ls -la .github/workflows || true

          echo
          echo "----- Show the workflow file the runner has on disk (first 200 lines) -----"
          WORKFLOW_PATH=".github/workflows/create-hw-issue.yml"
          if [ -f "$WORKFLOW_PATH" ]; then
            sed -n '1,200p' "$WORKFLOW_PATH" || true
          else
            echo "File not found at $WORKFLOW_PATH (maybe different filename). Listing directory:"
            ls -la .github/workflows || true
          fi

          echo
          echo "----- Raw file fetched from GitHub API at ref $GITHUB_SHA (first 200 lines) -----"
          curl -sS -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: token $REPO_TOKEN" \
            "https://api.github.com/repos/dakboard/DAKboard/contents/.github/workflows/create-hw-issue.yml?ref=$GITHUB_SHA" \
            -o /tmp/workflow_api.yml || true
          head -n 200 /tmp/workflow_api.yml || true

          echo
          echo "----- Done debug -----"

      - name: Create issue in dakboard/Hardware-OS (only if Hardware-OS, no duplicates)
        id: create_hardware_os
        env:
          CP_NUMBER: ${{ github.event.issue.number }}
          CP_TITLE: ${{ github.event.issue.title }}
          CP_BODY: ${{ github.event.issue.body }}
          CP_URL: ${{ github.event.issue.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -euo pipefail

          # === Config ===
          CP_OWNER="dakboard"
          CP_NAME="DAKboard"
          CP_REPO_NAME="${CP_OWNER}/${CP_NAME}"
          HW_REPO="dakboard/Hardware-OS"

          # Gate: must have Hardware-OS label in the event payload
          HAS_HARDWARE_OS=$(jq -r '.issue.labels[].name' "$GITHUB_EVENT_PATH" | grep -Fx "Hardware-OS" || true)
          if [ -z "$HAS_HARDWARE_OS" ]; then
            echo "Issue #$CP_NUMBER does not have Hardware-OS label. Skipping."
            exit 0
          fi

          # Hard dedupe: if marker label is present in THIS event payload, skip
          ALREADY_CREATED=$(jq -r '.issue.labels[].name' "$GITHUB_EVENT_PATH" | grep -Fx "hardware-os-child-created" || true)
          if [ -n "$ALREADY_CREATED" ]; then
            echo "Marker label hardware-os-child-created already present (payload). Skipping."
            exit 0
          fi

          echo "Issue #$CP_NUMBER has Hardware-OS and no marker (payload). Checking live labels on CP issue via GraphQL..."

          # === GraphQL read to avoid repo-path redirects ===
          GRAPHQL_PAYLOAD=$(
            jq -n --arg owner "$CP_OWNER" --arg name "$CP_NAME" --argjson number "$CP_NUMBER" \
            '{query: "query($owner:String!, $name:String!, $number:Int!){ repository(owner:$owner, name:$name){ issue(number:$number){ labels(first:100){ nodes{ name } } } } }", variables: {owner: $owner, name: $name, number: $number}}'
          )

          GRAPHQL_RESP=$(curl -sS -X POST \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: dakboard-actions" \
            -d "$GRAPHQL_PAYLOAD" \
            "https://api.github.com/graphql")

          echo "GraphQL response preview:"
          echo "$GRAPHQL_RESP" | jq '. | {errors: .errors, data_exists: (.data!=null)}' || echo "$GRAPHQL_RESP"

          ERR_COUNT=$(echo "$GRAPHQL_RESP" | jq -r '.errors | length // 0')
          if [ "$ERR_COUNT" -gt 0 ]; then
            echo "GraphQL returned errors:"
            echo "$GRAPHQL_RESP" | jq '.errors'
            exit 1
          fi

          # Extract live labels
          LIVE_LABELS=$(echo "$GRAPHQL_RESP" | jq -r '.data.repository.issue.labels.nodes[].name // empty' || true)
          LIVE_MARKER=$(echo "$LIVE_LABELS" | grep -Fx "hardware-os-child-created" || true)
          if [ -n "$LIVE_MARKER" ]; then
            echo "Marker label already present on CP issue (live). Skipping."
            exit 0
          fi

          echo "No marker on CP issue (live). Checking for existing child (best-effort search)..."

          # Best-effort dedupe via search
          SEARCH_QUERY="repo:${HW_REPO} is:issue in:title \"CP#${CP_NUMBER} —\""
          SEARCH_URL="https://api.github.com/search/issues?q=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$SEARCH_QUERY'''))")"

          SEARCH_RESP=$(curl -sS -L --location-trusted \
            -H "Authorization: token $REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: dakboard-actions" \
            "$SEARCH_URL")

          TOTAL=$(echo "$SEARCH_RESP" | jq -r '.total_count // 0')
          if [ "$TOTAL" -gt 0 ]; then
            EXISTING_URL=$(echo "$SEARCH_RESP" | jq -r '.items[0].html_url // ""')
            echo "Hardware-OS child issue already exists: $EXISTING_URL"

            # Add marker label so we don't keep checking/creating
            curl -sS -L --location-trusted -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: dakboard-actions" \
              "https://api.github.com/repos/${CP_REPO_NAME}/issues/$CP_NUMBER/labels" \
              -d "$(jq -n --arg l "hardware-os-child-created" '{labels: [$l]}')" >/dev/null

            exit 0
          fi

          echo "No existing child found. Creating Hardware-OS issue."

          TITLE="CP#${CP_NUMBER} — ${CP_TITLE}"
          BODY=$(printf "CP-ISSUE: %s\nDAKboard issue: %s\n\nCustomer reported:\n\n%s\n" "$CP_NUMBER" "$CP_URL" "$CP_BODY")

          JSON_PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$BODY" '{title: $title, body: $body}')

          # Create Hardware-OS issue (use REPO_TOKEN for cross-repo writes)
          HTTP_STATUS=$(curl -sS -L --location-trusted -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $REPO_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: dakboard-actions" \
            "https://api.github.com/repos/${HW_REPO}/issues" \
            -d "$JSON_PAYLOAD" || true)

          echo "HTTP_STATUS=$HTTP_STATUS"
          echo "API response:"
          cat response.json || true

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Failed to create Hardware-OS issue (status $HTTP_STATUS)"
            exit 1
          fi

          HW_NUMBER=$(jq -r '.number' response.json)
          echo "hardware_os_number=$HW_NUMBER" >> "$GITHUB_OUTPUT"

          # Add marker label to CP issue so we NEVER create duplicates on future events
          curl -sS -L --location-trusted -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: dakboard-actions" \
            "https://api.github.com/repos/${CP_REPO_NAME}/issues/$CP_NUMBER/labels" \
            -d "$(jq -n --arg l "hardware-os-child-created" '{labels: [$l]}')" >/dev/null

          echo "Added marker label hardware-os-child-created to CP issue #$CP_NUMBER"
