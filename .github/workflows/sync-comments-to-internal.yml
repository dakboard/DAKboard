name: Sync CP comments to Internal

on:
  issue_comment:
    types: [created]

jobs:
  sync_comment:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror comment into Internal issue
        run: |
          set -euo pipefail

          # Skip bot comments to avoid loops
          if [ "${{ github.event.comment.user.type }}" = "Bot" ]; then
            echo "Skipping bot comment"
            exit 0
          fi

          CP_NUMBER="${{ github.event.issue.number }}"
          TITLE_PREFIX="CP#${CP_NUMBER} —"
          echo "Looking for Internal issue matching prefix: $TITLE_PREFIX"

          # Fetch Internal issues and find matching one by title prefix
          RESP=$(curl -sS \
            -H "Authorization: token ${{ secrets.REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dakboard/Internal/issues?state=all&per_page=100")

          INTERNAL_NUMBER=$(echo "$RESP" | jq -r ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | .number" | head -n 1)

          if [ -z "$INTERNAL_NUMBER" ] || [ "$INTERNAL_NUMBER" = "null" ]; then
            echo "No matching Internal issue found"
            exit 0
          fi

          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          COMMENT_ID="${{ github.event.comment.id }}"
          # Use the repository that generated the event to handle repo rename automatically
          CP_REPO="${{ github.repository }}"
          COMMENT_URL="https://github.com/${CP_REPO}/issues/${CP_NUMBER}#issuecomment-${COMMENT_ID}"
          COMMENT_TEXT="${{ github.event.comment.body }}"

          echo "Posting comment from @${COMMENT_AUTHOR} to Internal issue #${INTERNAL_NUMBER}"

          # Build the body safely using jq so newlines, markdown, images and urls are preserved/escaped correctly.
          jq -n --arg author "${COMMENT_AUTHOR}" \
                --arg cp     "${CP_NUMBER}" \
                --arg text   "${COMMENT_TEXT}" \
                --arg url    "${COMMENT_URL}" \
                '{body: ("**Comment from @" + $author + " on issue #" + $cp + ":\\n\\n" + $text + "\\n\\n---\\n[View original comment](" + $url + ")")}' \
            > payload.json

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dakboard/Internal/issues/${INTERNAL_NUMBER}/comments" \
            -d @payload.json)

          echo "Comment HTTP status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Failed to post comment to Internal (status $HTTP_STATUS)"
            exit 1
          fi

