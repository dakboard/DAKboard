name: Sync CP comments to Internal

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  sync_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror comment into Internal issue
        shell: bash
        run: |
          set -euo pipefail

          # quick check: ensure we have the event payload file
          if [ -z "${GITHUB_EVENT_PATH:-}" ] || [ ! -f "$GITHUB_EVENT_PATH" ]; then
            echo "Event payload not found at GITHUB_EVENT_PATH"
            exit 1
          fi

          # Skip bot comments
          COMMENT_USER_TYPE=$(jq -r '.comment.user.type // ""' "$GITHUB_EVENT_PATH")
          if [ "$COMMENT_USER_TYPE" = "Bot" ]; then
            echo "Skipping bot comment (Bot)"
            exit 0
          fi

          # Use jq only to extract CP number and find the Internal issue
          CP_NUMBER=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          TITLE_PREFIX="CP#${CP_NUMBER} —"
          echo "Looking for Internal issue matching prefix: $TITLE_PREFIX"

          # Fetch Internal issues (API call)
          RESP=$(curl -sS \
            -H "Authorization: token ${{ secrets.REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dakboard/Internal/issues?state=all&per_page=100")

          INTERNAL_NUMBER=$(echo "$RESP" | jq -r ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | .number" | head -n 1)

          if [ -z "$INTERNAL_NUMBER" ] || [ "$INTERNAL_NUMBER" = "null" ]; then
            echo "No matching Internal issue found"
            exit 0
          fi

          echo "Internal issue #${INTERNAL_NUMBER} found. Building payload entirely inside jq..."

          # Build the JSON payload using jq alone (never let shell evaluate the comment body)
          jq --slurpfile ev "$GITHUB_EVENT_PATH" \
            -n '
              # $ev is an array with a single element = the event JSON
              ($ev[0]) as $e
              |
              # prepare fields
              ($e.comment.user.login // "") as $author
              |
              ($e.issue.number | tostring) as $cpnum
              |
              ($e.comment.id | tostring) as $cid
              |
              ($e.repository.full_name // "") as $repo
              |
              ($e.comment.body // "") as $comment_body
              |
              # construct a rendered markdown body; jq will correctly escape content into JSON
              { body:
                  ("**Comment from @" + $author + " on " + $repo + " issue #" + $cpnum + ":\\n\\n" + $comment_body + "\\n\\n---\\n[View original comment](https://github.com/" + $repo + "/issues/" + $cpnum + "#issuecomment-" + $cid + ")")
              }
            ' \
            | curl -sS -X POST \
                -H "Authorization: token ${{ secrets.REPO_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/dakboard/Internal/issues/${INTERNAL_NUMBER}/comments" \
                -d @- \
            -o response.json -w "%{http_code}" \
            > status.txt

          HTTP_STATUS=$(cat status.txt)
          echo "Comment HTTP status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Failed to post comment to Internal (status $HTTP_STATUS)"
            exit 1
          fi

          echo "Posted comment safely."

